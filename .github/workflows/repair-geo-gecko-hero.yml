name: Repair Geo Gecko Hero

on:
  workflow_dispatch:
  push:
    paths:
      - ".fixhero.*"
      - ".github/workflows/repair-geo-gecko-hero.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and verify JPEG
        shell: bash
        run: |
          shopt -s nullglob
          parts=(.fixhero.*)
          if (( ${#parts[@]} == 0 )); then
            echo "No repair parts present."
            exit 0
          fi
          cat "${parts[@]}" | base64 --decode > /tmp/hero-3d.jpg
          echo "ae167c0b5b8919751a5ca94fb540099d8e87032a0b237d6a49f6a29fd995b9e5  /tmp/hero-3d.jpg" | sha256sum --check -
          test "$(stat -c %s /tmp/hero-3d.jpg)" = "10208"
          file /tmp/hero-3d.jpg | grep -q "JPEG image data"
          cp /tmp/hero-3d.jpg brand/mascot/hero-3d.jpg
          rm -f .fixhero.*

      - name: Commit repaired hero
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A brand/mascot/hero-3d.jpg .fixhero.00 .fixhero.01 .fixhero.02 .fixhero.03 .fixhero.04
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "fix: restore valid Geo Gecko hero JPEG"
          git push origin "HEAD:${GITHUB_REF_NAME}"
