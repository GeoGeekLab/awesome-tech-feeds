name: Feed Health

on:
  push:
    branches: [main]
    paths:
      - "sources/**"
      - "src/techfeeds/probe.py"
      - ".github/workflows/feed-health.yml"
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: feed-health
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - name: Probe feeds
        run: techfeeds probe --concurrency 8
      - name: Retain workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: feed-health
          path: generated/health.json
          retention-days: 30
      - name: Publish stable health snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view health-latest >/dev/null 2>&1; then
            gh release upload health-latest generated/health.json --clobber
          else
            gh release create health-latest generated/health.json \
              --title "Feed Health (latest)" \
              --notes "Machine-readable snapshot generated by the scheduled feed-health workflow. Health is operational evidence, not editorial quality." \
              --prerelease \
              --target "${GITHUB_SHA}"
          fi
