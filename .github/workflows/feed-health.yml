name: Feed Health

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: feed-health
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - name: Probe feeds
        run: techfeeds probe --concurrency 8
      - uses: actions/upload-artifact@v4
        with:
          name: feed-health
          path: generated/health.json
          retention-days: 30
