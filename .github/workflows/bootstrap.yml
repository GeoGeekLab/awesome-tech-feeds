name: Bootstrap Repository

on:
  push:
    branches: ["feat/initial-registry"]
    paths: ["bootstrap.tar.gz"]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/initial-registry
      - name: Expand repository payload
        run: |
          tar -xzf bootstrap.tar.gz
          rm bootstrap.tar.gz
          rm .github/workflows/bootstrap.yml
      - name: Commit repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add curated tech feed registry"
          git push origin HEAD:feat/initial-registry
