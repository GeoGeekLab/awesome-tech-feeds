name: Render Geo Gecko Assets

on:
  workflow_dispatch:
  push:
    paths:
      - "brand/mascot/**/*.svg"
      - "scripts/generate_mascot_sources.py"
      - "scripts/render_mascot_assets.py"
      - ".github/workflows/mascot-assets.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate canonical mascot variants
        run: python scripts/generate_mascot_sources.py
      - name: Install render dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2 libpango-1.0-0 libpangocairo-1.0-0
          python -m pip install "CairoSVG==2.7.1" "Pillow==11.3.0"
      - name: Render raster exports and previews
        run: python scripts/render_mascot_assets.py
      - name: Commit individual mascot assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A brand/mascot
          if git diff --cached --quiet; then
            echo "Geo Gecko assets already current."
            exit 0
          fi
          git commit -m "chore: generate Geo Gecko asset exports"
          git push origin "HEAD:${GITHUB_REF_NAME}"
