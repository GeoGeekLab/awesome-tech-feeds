name: Release Registry

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - name: Validate registry
        run: |
          techfeeds validate
          techfeeds compile --check
      - name: Checksums
        run: sha256sum generated/*.json generated/*.opml generated/catalog.md > generated/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            generated/*.json
            generated/*.opml
            generated/catalog.md
            generated/SHA256SUMS
