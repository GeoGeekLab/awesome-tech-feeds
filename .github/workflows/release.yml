name: Release Registry

on:
  push:
    tags: ["v*"]
    branches: ["release/v*"]

permissions:
  contents: write

jobs:
  prepare-tag:
    if: startsWith(github.ref, 'refs/heads/release/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create release tag
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#release/}"
          if git rev-parse --verify "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" -m "Release ${tag}"
          git push origin "${tag}"

  release:
    needs: [prepare-tag]
    if: always() && (startsWith(github.ref, 'refs/tags/v') || needs.prepare-tag.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Resolve release tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${GITHUB_REF_NAME#release/}"
          fi
          echo "RELEASE_TAG=${tag}" >> "${GITHUB_ENV}"
          echo "RELEASE_VERSION=${tag#v}" >> "${GITHUB_ENV}"
      - name: Install
        run: python -m pip install -e .
      - name: Validate registry
        run: |
          techfeeds validate
          techfeeds compile --check
      - name: Checksums
        run: |
          sha256sum \
            generated/*.json \
            generated/*.opml \
            generated/catalog.md \
            schema/source.schema.json \
            schema/source.v1.schema.json \
            schema/source.v2.schema.json \
            > generated/SHA256SUMS
      - name: Build release notes
        shell: bash
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["RELEASE_VERSION"]
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = rf"(?ms)^## {re.escape(version)}(?:[^\n]*)\n(.*?)(?=^## |\Z)"
          match = re.search(pattern, changelog)
          notes = match.group(1).strip() if match else f"Release {os.environ['RELEASE_TAG']}"
          Path("release-notes.md").write_text(notes + "\n", encoding="utf-8")
          PY
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Awesome Tech Feeds ${{ env.RELEASE_TAG }}
          body_path: release-notes.md
          make_latest: true
          files: |
            generated/*.json
            generated/*.opml
            generated/catalog.md
            generated/SHA256SUMS
            schema/source.schema.json
            schema/source.v1.schema.json
            schema/source.v2.schema.json
