name: Import Geo Gecko 3D Hero

on:
  push:
    branches:
      - brand/geo-gecko-3d
    paths:
      - ".geo-gecko-3d-512.b64"
      - ".github/workflows/import-geo-gecko-3d.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode approved hero
        shell: bash
        run: |
          base64 --decode .geo-gecko-3d-512.b64 > brand/mascot/hero-3d.jpg
          echo "fbf2d86a574a7f972cbd68318a245907a4572e18d25fd553b5ee85c824da0bc3  brand/mascot/hero-3d.jpg" | sha256sum --check -
      - name: Remove import staging
        shell: bash
        run: |
          rm -f .geo-gecko-3d-512.b64
          rm -f .geo-gecko-3d.part00 .geo-gecko-3d.part01 .geo-gecko-3d.part02
          rm -f .github/workflows/import-geo-gecko-3d.yml
      - name: Commit approved 3D hero
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "brand: import approved 3D Geo Gecko hero"
          git push origin "HEAD:${GITHUB_REF_NAME}"
