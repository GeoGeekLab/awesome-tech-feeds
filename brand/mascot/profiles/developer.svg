<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="title desc">
  <title id="title">Geo Gecko mascot</title>
  <desc id="desc">A flat vector gecko holding a terminal, with a curled RSS signal tail.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#010409" flood-opacity=".24"/>
    </filter>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#E6FFFA"/>
      <stop offset="1" stop-color="#B7F7E4"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#58A6FF"/>
      <stop offset="1" stop-color="#2F81F7"/>
    </linearGradient>
  </defs>

  <g filter="url(#shadow)">
    <!-- tail -->
    <path d="M430 392c79 7 130-25 132-81 1-44-37-70-72-56-24 9-37 32-27 52 9 18 34 20 47 8"
          fill="none" stroke="#0D1117" stroke-width="42" stroke-linecap="round"/>
    <path d="M430 392c79 7 130-25 132-81 1-44-37-70-72-56-24 9-37 32-27 52 9 18 34 20 47 8"
          fill="none" stroke="url(#signal)" stroke-width="26" stroke-linecap="round"/>

    <!-- legs -->
    <path d="M216 430c-30 35-39 81-5 108 26 20 69 13 84-17"
          fill="none" stroke="#0D1117" stroke-width="42" stroke-linecap="round"/>
    <path d="M424 430c30 35 39 81 5 108-26 20-69 13-84-17"
          fill="none" stroke="#0D1117" stroke-width="42" stroke-linecap="round"/>
    <path d="M216 430c-30 35-39 81-5 108 26 20 69 13 84-17"
          fill="none" stroke="#B7F7E4" stroke-width="24" stroke-linecap="round"/>
    <path d="M424 430c30 35 39 81 5 108-26 20-69 13-84-17"
          fill="none" stroke="#B7F7E4" stroke-width="24" stroke-linecap="round"/>

    <!-- body -->
    <path d="M205 280c-26 54-21 166 15 208 23 27 64 40 100 40s77-13 100-40c36-42 41-154 15-208-24-49-70-72-115-72s-91 23-115 72Z"
          fill="url(#body)" stroke="#0D1117" stroke-width="14" stroke-linejoin="round"/>

    <!-- head silhouette -->
    <path d="M157 195c0-80 64-132 163-132s163 52 163 132c0 71-65 111-163 111S157 266 157 195Z"
          fill="url(#body)" stroke="#0D1117" stroke-width="14"/>

    <!-- eye housings -->
    <path d="M176 152c5-48 35-78 76-78 39 0 66 30 66 72 0 46-25 79-70 79-48 0-76-28-72-73Z"
          fill="#F0F6FC" stroke="#0D1117" stroke-width="12"/>
    <path d="M464 152c-5-48-35-78-76-78-39 0-66 30-66 72 0 46 25 79 70 79 48 0 76-28 72-73Z"
          fill="#F0F6FC" stroke="#0D1117" stroke-width="12"/>

    <!-- pupils -->
    <ellipse cx="250" cy="153" rx="29" ry="39" fill="#0D1117"/>
    <ellipse cx="390" cy="153" rx="29" ry="39" fill="#0D1117"/>
    <circle cx="238" cy="139" r="9" fill="#58A6FF"/>
    <circle cx="378" cy="139" r="9" fill="#58A6FF"/>
    <rect x="242" y="183" width="17" height="6" rx="3" fill="#39D353"/>
    <rect x="382" y="183" width="17" height="6" rx="3" fill="#39D353"/>

    <!-- face -->
    <circle cx="300" cy="231" r="5" fill="#0D1117"/>
    <circle cx="340" cy="231" r="5" fill="#0D1117"/>
    <path d="M282 250c24 18 52 18 76 0" fill="none" stroke="#0D1117" stroke-width="8" stroke-linecap="round"/>

    <!-- arms -->
    <path d="M210 329c-39 9-67 38-74 73" fill="none" stroke="#0D1117" stroke-width="36" stroke-linecap="round"/>
    <path d="M430 329c39 9 67 38 74 73" fill="none" stroke="#0D1117" stroke-width="36" stroke-linecap="round"/>
    <path d="M210 329c-39 9-67 38-74 73" fill="none" stroke="#B7F7E4" stroke-width="20" stroke-linecap="round"/>
    <path d="M430 329c39 9 67 38 74 73" fill="none" stroke="#B7F7E4" stroke-width="20" stroke-linecap="round"/>

    <!-- terminal -->
    <rect x="164" y="350" width="312" height="166" rx="22" fill="#0D1117" stroke="#30363D" stroke-width="8"/>
    <rect x="164" y="350" width="312" height="38" rx="22" fill="#161B22"/>
    <circle cx="190" cy="369" r="7" fill="#FF7B72"/>
    <circle cx="214" cy="369" r="7" fill="#D29922"/>
    <circle cx="238" cy="369" r="7" fill="#3FB950"/>
    <path d="M211 431l28 20-28 20" fill="none" stroke="#39D353" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M258 471h80" fill="none" stroke="#58A6FF" stroke-width="12" stroke-linecap="round"/>
    <path d="M355 430h68M355 453h46" fill="none" stroke="#8B949E" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- RSS spark -->
  <g transform="translate(500 252)" fill="none" stroke="#58A6FF" stroke-width="12" stroke-linecap="round">
    <circle cx="0" cy="56" r="7" fill="#58A6FF" stroke="none"/>
    <path d="M0 31a25 25 0 0 1 25 25"/>
    <path d="M0 2a54 54 0 0 1 54 54"/>
  </g>
<g transform="translate(147 294)"><rect width="218" height="112" rx="18" fill="#0B1F3A" stroke="#0F172A" stroke-width="8"/><text x="109" y="43" text-anchor="middle" font-family="monospace" font-size="24" font-weight="700" fill="#FFFFFF">&lt;/&gt;</text><text x="109" y="78" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#E2E8F0">Developer</text></g></svg>