<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Awesome Tech Feeds terminal banner with Geo Gecko</title>
  <desc id="desc">A GitHub-style dark terminal banner showing Awesome Tech Feeds commands beside the Geo Gecko mascot.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0D1117"/>
      <stop offset="1" stop-color="#161B22"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#E6FFFA"/>
      <stop offset="1" stop-color="#B7F7E4"/>
    </linearGradient>
    <linearGradient id="tail" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#58A6FF"/>
      <stop offset="1" stop-color="#2F81F7"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="520" rx="28" fill="url(#bg)"/>
  <rect x="26" y="26" width="1148" height="468" rx="22" fill="none" stroke="#30363D" stroke-width="2"/>

  <!-- terminal chrome -->
  <circle cx="62" cy="62" r="8" fill="#FF7B72"/>
  <circle cx="88" cy="62" r="8" fill="#D29922"/>
  <circle cx="114" cy="62" r="8" fill="#3FB950"/>
  <text x="150" y="69" fill="#8B949E" font-size="20" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">awesome-tech-feeds — bash</text>

  <!-- terminal copy -->
  <text x="72" y="150" fill="#39D353" font-size="34" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">$</text>
  <text x="112" y="150" fill="#F0F6FC" font-size="34" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">techfeeds</text>

  <text x="72" y="205" fill="#8B949E" font-size="24" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">registry as code // RSS + Atom</text>

  <text x="72" y="270" fill="#58A6FF" font-size="24" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">sources/</text>
  <text x="206" y="270" fill="#8B949E" font-size="24" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">-&gt; validate -&gt; compile -&gt;</text>
  <text x="520" y="270" fill="#A5D6FF" font-size="24" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">JSON / OPML</text>

  <text x="72" y="324" fill="#58A6FF" font-size="24" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">health</text>
  <text x="156" y="324" fill="#8B949E" font-size="24" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">-&gt; scheduled probes</text>

  <rect x="72" y="370" width="488" height="64" rx="12" fill="#0B1520" stroke="#30363D"/>
  <text x="96" y="411" fill="#39D353" font-size="23" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">git pull</text>
  <text x="204" y="411" fill="#8B949E" font-size="23" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">&amp;&amp;</text>
  <text x="244" y="411" fill="#F0F6FC" font-size="23" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">read better feeds</text>

  <!-- gecko, simplified -->
  <g transform="translate(650 36)">
    <path d="M312 348c88 9 143-27 145-89 2-46-38-75-75-59-26 11-39 36-28 57 10 18 36 21 50 8"
          fill="none" stroke="#0D1117" stroke-width="40" stroke-linecap="round"/>
    <path d="M312 348c88 9 143-27 145-89 2-46-38-75-75-59-26 11-39 36-28 57 10 18 36 21 50 8"
          fill="none" stroke="url(#tail)" stroke-width="24" stroke-linecap="round"/>
    <path d="M126 206c0-86 70-142 178-142s178 56 178 142c0 75-70 120-178 120S126 281 126 206Z"
          fill="url(#body)" stroke="#010409" stroke-width="14"/>
    <path d="M146 162c5-52 38-84 82-84 43 0 73 32 73 78 0 49-28 85-76 85-50 0-84-31-79-79Z"
          fill="#F0F6FC" stroke="#010409" stroke-width="12"/>
    <path d="M462 162c-5-52-38-84-82-84-43 0-73 32-73 78 0 49 28 85 76 85 50 0 84-31 79-79Z"
          fill="#F0F6FC" stroke="#010409" stroke-width="12"/>
    <ellipse cx="225" cy="165" rx="31" ry="42" fill="#0D1117"/>
    <ellipse cx="383" cy="165" rx="31" ry="42" fill="#0D1117"/>
    <circle cx="212" cy="149" r="9" fill="#58A6FF" filter="url(#glow)"/>
    <circle cx="370" cy="149" r="9" fill="#58A6FF" filter="url(#glow)"/>
    <rect x="216" y="197" width="18" height="6" rx="3" fill="#39D353"/>
    <rect x="374" y="197" width="18" height="6" rx="3" fill="#39D353"/>
    <circle cx="286" cy="257" r="5" fill="#0D1117"/>
    <circle cx="322" cy="257" r="5" fill="#0D1117"/>
    <path d="M270 276c22 17 46 17 68 0" fill="none" stroke="#0D1117" stroke-width="8" stroke-linecap="round"/>

    <!-- terminal held by gecko -->
    <rect x="145" y="302" width="318" height="152" rx="20" fill="#0D1117" stroke="#30363D" stroke-width="8"/>
    <rect x="145" y="302" width="318" height="36" rx="20" fill="#161B22"/>
    <circle cx="171" cy="320" r="6" fill="#FF7B72"/>
    <circle cx="193" cy="320" r="6" fill="#D29922"/>
    <circle cx="215" cy="320" r="6" fill="#3FB950"/>
    <path d="M193 380l27 20-27 20" fill="none" stroke="#39D353" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M243 420h79" fill="none" stroke="#58A6FF" stroke-width="11" stroke-linecap="round"/>
    <path d="M342 378h67M342 401h44" fill="none" stroke="#8B949E" stroke-width="8" stroke-linecap="round"/>

    <g transform="translate(427 223)" fill="none" stroke="#58A6FF" stroke-width="10" stroke-linecap="round">
      <circle cx="0" cy="52" r="6" fill="#58A6FF" stroke="none"/>
      <path d="M0 29a23 23 0 0 1 23 23"/>
      <path d="M0 3a49 49 0 0 1 49 49"/>
    </g>
  </g>
</svg>