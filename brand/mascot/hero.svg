<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Awesome Tech Feeds with Geo Gecko</title>
<desc id="desc">A GitHub-style banner with a cute cartoon gecko mascot beside feed and terminal motifs.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#0D1117"/>
    <stop offset="1" stop-color="#161B22"/>
  </linearGradient>
  <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#CFFCEB"/>
    <stop offset="1" stop-color="#8DE6C7"/>
  </linearGradient>
  <linearGradient id="tail" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#79C0FF"/>
    <stop offset="1" stop-color="#388BFD"/>
  </linearGradient>
</defs>
