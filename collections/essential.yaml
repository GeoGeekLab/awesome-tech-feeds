schema_version: 1
id: essential
name: Essential Tech Sources
description: A deliberately small, high-signal starting set spanning independent writers,
  production engineering, security, systems, AI research, and a focused technical community.
sources:
- simon-willison
- julia-evans
- martin-fowler
- dan-luu
- brendan-gregg
- mitchell-hashimoto
- troy-hunt
- bruce-schneier
- cloudflare
- netflix-techblog
- stripe-blog
- tailscale
- oxide-computer
- kubernetes-blog
- anthropic
- google-deepmind
- hugging-face
- lobsters
policy:
  max_sources: 20
  require_rationale: true
  review_interval_days: 90
selection_rationale:
  simon-willison: >-
    High-frequency practitioner writing that connects AI, Python, databases, and the web with reproducible technical detail.
  julia-evans: >-
    Exceptionally clear systems, networking, and developer-tool explanations grounded in hands-on debugging and learning.
  martin-fowler: >-
    Durable software architecture and design writing that remains useful well beyond individual framework cycles.
  dan-luu: >-
    Evidence-driven long-form analysis of systems, performance, engineering practice, and technology organizations.
  brendan-gregg: >-
    Authoritative production performance and observability material from a practitioner who develops widely used methods and tools.
  mitchell-hashimoto: >-
    Deep practitioner perspective on infrastructure, developer tools, systems software, and open-source engineering.
  troy-hunt: >-
    Practical first-hand coverage of web security, identity, breaches, and defensive engineering for working developers.
  bruce-schneier: >-
    Long-running security and privacy analysis that adds policy, threat-model, and research context to practitioner feeds.
  cloudflare: >-
    First-party internet infrastructure, networking, performance, and security engineering with unusually detailed production write-ups.
  netflix-techblog: >-
    Production-scale distributed-systems and data-platform engineering with concrete architecture and operational lessons.
  stripe-blog: >-
    High-quality engineering and product-infrastructure writing spanning APIs, systems design, reliability, and developer experience.
  tailscale: >-
    Practitioner-heavy networking and security writing that explains modern protocols, identity, and infrastructure trade-offs clearly.
  oxide-computer: >-
    Deep systems engineering across hardware, operating systems, networking, and infrastructure with strong first-principles analysis.
  kubernetes-blog: >-
    First-party source for Kubernetes engineering, releases, ecosystem changes, and operational guidance.
  anthropic: >-
    First-party frontier AI research and engineering updates with direct relevance to LLM systems and model behavior.
  google-deepmind: >-
    First-party AI research coverage spanning frontier models, scientific applications, and research methodology.
  hugging-face: >-
    Open-source AI and machine-learning engineering from a central ecosystem for models, datasets, tooling, and practitioner workflows.
  lobsters: >-
    A technically focused community feed that broadens discovery while maintaining substantially lower topical noise than general news feeds.
